stages:
  - test

variables:
  PUBLIC_TOOLS_COVERAGE_THRESHOLD: "90"

test:opencalcypher:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash
  script:
    - bash docker-test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

coverage:opencalcypher:
  stage: test
  image: node:22-alpine
  before_script:
    - node --version
  script:
    - node scripts/check-coverage.js
  coverage: '/OPENCALCYPHER_COVERAGE=([0-9]+\.[0-9]+)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
