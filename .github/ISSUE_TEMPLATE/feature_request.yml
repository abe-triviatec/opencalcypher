name: Feature request
description: Suggest a public-scope OpenCalcypher improvement.
title: "[feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        OpenCalcypher scope is local artifact tooling only. Requests for encrypted computation,
        SQL/CQL, hosted APIs, analytics, production deployment, or enterprise internals are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope confirmation
      options:
        - label: This request stays inside local artifact tooling and does not require proprietary Calcypher internals.
          required: true

